name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true

      - name: Install lint environment
        run: pixi install --locked -e lint

      - name: Lint
        run: pixi run -e lint ruff check trainer corpus_builder

      - name: Check formatting
        run: pixi run -e lint ruff format --check trainer corpus_builder

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.1
          cache: true

      - name: Install dataset test environment
        run: pixi install --locked -e dataset-ci

      - name: Run dataset tests
        run: pixi run -e dataset-ci pytest -v corpus_builder/tests

      - name: Install trainer test environment
        run: pixi install --locked -e trainer-ci

      - name: Run trainer tests
        run: pixi run -e trainer-ci pytest -v trainer/unsloth/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: corpus_builder/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: corpus_builder/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
