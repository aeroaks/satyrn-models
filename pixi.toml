[workspace]
name = "satyrn-models"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Package features: one CLI package per feature, never composed together.
[feature.dataset.dependencies]
python = ">=3.13,<3.14"

[feature.dataset.pypi-dependencies]
satyrn-corpus-builder = { path = "corpus_builder", editable = true }

[feature.trainer.dependencies]
python = ">=3.13.9,<3.14"

[feature.trainer.pypi-dependencies]
satyrn-unsloth = { path = "trainer/unsloth", editable = true }

# unsloth-zoo caps datasets <4.4.0 but inspect-evals needs >=4.8.5 (same override as uv.toml).
[feature.trainer.pypi-options.dependency-overrides]
datasets = ">=4.8.5"

# Molab: operator-verified Python 3.13.11 (CUDA wheel source not yet verified, so none is configured).
[feature.molab.dependencies]
python = "==3.13.11"

# Model profiles: versions recorded in trainer/unsloth/configs/model/*.yaml and docs/trainer_unsloth.md.
[feature.mellum.pypi-dependencies]
transformers = "==5.15.0"
torch = "==2.11.0"
torchvision = "==0.26.0"
trl = "==1.7.0"

[feature.mellum.pypi-options.dependency-overrides]
# unsloth pins trl==0.24.0 (trl#6105); xformers needs the mslk build for torch 2.11 (same overrides as uv.toml).
trl = "==1.7.0"
mslk = "==1.1.1"
# unsloth caps transformers <=5.5.0; Mellum needs >=5.10.1 and is tested on 5.15.0.
transformers = "==5.15.0"

[feature.gemma.pypi-dependencies]
transformers = "==5.5.0"
torch = "==2.11.0"
torchvision = "==0.26.0"
trl = "==1.7.0"

[feature.gemma.pypi-options.dependency-overrides]
trl = "==1.7.0"
mslk = "==1.1.1"

[feature.qwen36-27b.pypi-dependencies]
transformers = "==5.3.0"
torch = "==2.11.0"
flash-linear-attention = "*"
causal-conv1d = "*"

[feature.qwen36-27b.pypi-options.dependency-overrides]
# The Qwen3.6-27B config does not record Torch or TRL pins. These are unverified candidate
# settings inherited from the current uv.toml: trl 1.7.0 (trl#6105 fix) and mslk 1.1.1 (the
# build for torch 2.11, hence the explicit torch==2.11.0 above). Not tested on any target.
trl = "==1.7.0"
mslk = "==1.1.1"

[feature.qwen36-35b.pypi-dependencies]
transformers = "==5.3.0"
trl = "==0.22.2"
torch = "==2.8.0"
flash-linear-attention = "*"
causal-conv1d = "==1.6.0"

[feature.qwen36-35b.pypi-options.dependency-overrides]
# Config records trl 0.22.2; unsloth pins trl==0.24.0.
trl = "==0.22.2"

# molab-* are candidate lock environments only: resolution and import checks do not establish
# Molab runtime support.
[environments]
dataset-local = { features = ["dataset"], no-default-feature = true }
molab-mellum = { features = ["trainer", "molab", "mellum"], no-default-feature = true }
molab-gemma = { features = ["trainer", "molab", "gemma"], no-default-feature = true }
molab-qwen36-27b = { features = ["trainer", "molab", "qwen36-27b"], no-default-feature = true }
molab-qwen36-35b = { features = ["trainer", "molab", "qwen36-35b"], no-default-feature = true }
